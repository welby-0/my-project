<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .float { animation: float 2.4s ease-in-out infinite; transform-origin: 200px 230px; }
    .wave { animation: wave 1.1s ease-in-out infinite; transform-origin: 292px 250px; }
    .blink { animation: blink 4s infinite; transform-origin: 200px 215px; }
    .spark { animation: spark 1.8s ease-in-out infinite; transform-origin: 330px 120px; }
    .shadow { animation: shadow 2.4s ease-in-out infinite; transform-origin: 200px 392px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-28deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes spark { 0%,100% { transform: scale(0.6); opacity: .4; } 50% { transform: scale(1.1); opacity: 1; } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .25; } 50% { transform: scaleX(.8); opacity: .15; } }
  </style>

  <ellipse class="shadow" cx="200" cy="392" rx="90" ry="12" fill="#000"/>

  <g class="float">
    <!-- handle -->
    <path d="M150 130 C150 60, 250 60, 250 130" fill="none" stroke="#E8501A" stroke-width="14" stroke-linecap="round"/>
    <!-- bag body -->
    <path d="M105 130 H295 L315 360 Q316 380 296 380 H104 Q84 380 85 360 Z" fill="#FF6B35"/>
    <path d="M105 130 H295 L299 175 H101 Z" fill="#FF8A5B"/>
    <!-- left arm -->
    <path d="M92 250 Q60 270 70 300" fill="none" stroke="#FF6B35" stroke-width="16" stroke-linecap="round"/>
    <!-- waving arm -->
    <g class="wave">
      <path d="M292 250 Q335 235 345 195" fill="none" stroke="#FF6B35" stroke-width="16" stroke-linecap="round"/>
      <circle cx="346" cy="190" r="12" fill="#FFD7C2"/>
    </g>
    <!-- face -->
    <g class="blink">
      <ellipse cx="160" cy="215" rx="17" ry="22" fill="#fff"/>
      <ellipse cx="240" cy="215" rx="17" ry="22" fill="#fff"/>
      <circle cx="164" cy="220" r="10" fill="#2B2D42"/>
      <circle cx="244" cy="220" r="10" fill="#2B2D42"/>
      <circle cx="168" cy="215" r="3.5" fill="#fff"/>
      <circle cx="248" cy="215" r="3.5" fill="#fff"/>
    </g>
    <ellipse cx="133" cy="254" rx="13" ry="8" fill="#FF4D6D" opacity=".45"/>
    <ellipse cx="267" cy="254" rx="13" ry="8" fill="#FF4D6D" opacity=".45"/>
    <path d="M180 258 Q200 282 220 258 Z" fill="#2B2D42"/>
    <path d="M190 268 Q200 276 210 268 Q200 263 190 268 Z" fill="#FF7A90"/>
    <!-- P badge -->
    <circle cx="200" cy="335" r="24" fill="#fff"/>
    <text x="200" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="#FF6B35">P</text>
  </g>

  <!-- sparkle -->
  <path class="spark" d="M330 100 L336 116 L352 122 L336 128 L330 144 L324 128 L308 122 L324 116 Z" fill="#FFC53D"/>

  <!-- wordmark -->
  <text x="200" y="425" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" letter-spacing="3" fill="#2B2D42">PASAR<tspan fill="#FF6B35">IN</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
